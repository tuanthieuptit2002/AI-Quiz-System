name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      all:
        description: Build lại cả backend và frontend dù không có thay đổi
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy lên VPS qua SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 25m
          script: bash /home/quizspace-tuandev/scripts/deploy.sh ${{ inputs.all && '--all' || '' }}
